services:
  backend:
    build: ./backend
    environment:
      TZ: Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/expense_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: expense_app
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-expense_app_dev}
      JWT_SECRET: ${JWT_SECRET:?Generate JWT_SECRET first; see README}
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ['8080:8080']
    volumes: [attachments:/app/data/attachments]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ['5173:8080']
  mysql:
    image: mysql:8.0
    container_name: expense-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-expense_root_dev}
      MYSQL_DATABASE: expense_platform
      MYSQL_USER: expense_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-expense_app_dev}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: expense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  rabbitmq:
    profiles: [extras]
    image: rabbitmq:3-management
    container_name: expense-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: expense_mq
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-expense_mq_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    profiles: [extras]
    image: minio/minio:latest
    container_name: expense-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-expense_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-expense_minio_dev}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  attachments:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
